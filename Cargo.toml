[package]
name = "gamerrust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
gilrs = "0.11.2"
glam = { version = "0.30", features = ["mint"] }
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
instant = "0.1"
log = "0.4"
pollster = "0.4"
rodio = "0.21.1"
tobj = "4.0.5"
wgpu = "30"
winit = "0.30"
